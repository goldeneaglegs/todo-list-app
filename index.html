<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple to-do list with priorities, due dates, dark mode, and local storage." />
    <title>TaskFlow — To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-container" aria-labelledby="app-title">
        <header class="app-header">
          <div>
            <p class="eyebrow">YOUR PRODUCTIVITY SPACE</p>
            <h1 id="app-title">TaskFlow <span aria-hidden="true">✓</span></h1>
            <p class="subtitle">Turn plans into progress.</p>
          </div>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark mode" title="Toggle theme">☾</button>
        </header>

        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Task name</label>
          <input id="todo-input" type="text" placeholder="What needs to be done?" maxlength="120" required />
          <label class="sr-only" for="priority-input">Task priority</label>
          <select id="priority-input" aria-label="Task priority">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>
          <label class="sr-only" for="due-date-input">Due date</label>
          <input id="due-date-input" type="date" aria-label="Due date (optional)" />
          <button class="primary-btn" type="submit"><span aria-hidden="true">+</span> Add task</button>
        </form>

        <div class="toolbar">
          <div id="todo-count" class="todo-count" aria-live="polite">0 tasks left</div>
          <div class="filters" role="group" aria-label="Task filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <footer class="list-footer">
          <span id="completion-summary">0% complete</span>
          <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
